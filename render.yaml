# Render Blueprint: backend (Docker + persistent disk for SQLite) and frontend (static site).
# Deploy: Render dashboard -> New -> Blueprint -> select this repo. Then fill in the
# `sync: false` variables when prompted (keys and URLs are never stored in Git).
services:
  - type: web
    name: lyftr-ai-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Persistent disks need a paid instance type; "starter" is the smallest.
    plan: starter
    healthCheckPath: /health
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: LLM_API_KEYS          # comma-separated, at least two keys
        sync: false
      - key: ALLOWED_ORIGINS       # the frontend URL, e.g. https://lyftr-ai-frontend.onrender.com
        sync: false
      - key: LLM_MODEL
        value: gemini/gemini-3.5-flash-lite
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: CACHE_DIR
        value: /data/litellm-cache
      - key: CACHE_ENABLED
        value: "true"
      - key: CACHE_TYPE
        value: disk
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"

  - type: web
    name: lyftr-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL     # the backend URL, e.g. https://lyftr-ai-backend.onrender.com
        sync: false
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
