# Render Blueprint: backend (Docker web service) + frontend (static site).
# Deploy: Render dashboard -> New -> Blueprint -> select this repo, then fill in the
# `sync: false` variables when prompted (keys and URLs are never stored in Git).
#
# Free plan: Render's free instances have no persistent disk, so the SQLite file
# and the LiteLLM disk cache under /data last until the instance restarts or is
# redeployed (and free instances sleep after 15 min idle). For durable history,
# switch the backend to `plan: starter` and uncomment the `disk` block.
services:
  - type: web
    name: lyftr-ai-12sohamverma-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    # disk:                     # paid plans only
    #   name: sqlite-data
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      - key: LLM_API_KEYS          # comma-separated, at least two keys
        sync: false
      - key: ALLOWED_ORIGINS       # the frontend URL, e.g. https://lyftr-ai-12sohamverma.onrender.com
        sync: false
      - key: LLM_MODEL
        value: gemini/gemini-3.5-flash-lite
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: CACHE_DIR
        value: /data/litellm-cache
      - key: CACHE_ENABLED
        value: "true"
      - key: CACHE_TYPE
        value: disk
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"

  - type: web
    name: lyftr-ai-12sohamverma
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL     # the backend URL, e.g. https://lyftr-ai-12sohamverma-api.onrender.com
        sync: false
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
